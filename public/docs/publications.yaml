  - title: "@GrokSet: Multi-Party Human-LLM Interactions in Social Media"
    authors: "Matteo Migliarini, Berat Ercevik, Oluwagbemike Olowe, Saira Fatima, Sarah Zhao, Minh Anh Le, Vasu Sharma, Ashwinee Panda"
    venue: "Preprint"
    year: 2026
    featured: true
    type: preprint
    summary: "A dataset of over 1M tweets involving @Grok on X. Users invoke the model as an arbiter in polarizing debates, engage with it less than with human peers, and bypass safety filters through simple persona adoption."
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2602.21236
