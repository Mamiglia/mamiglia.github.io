publications:
  - title: "Quantifying Self-Preservation Bias in Large Language Models"
    authors: "Matteo Migliarini, Joaquin Pereira Pizzini, Luca Moresca, Valerio Santini, Indro Spinelli, Fabio Galasso"
    venue: "EMNLP"
    year: 2026
    featured: true
    type: conference
    summary: "A methodology for measuring self-preservation propensity via counterfactual roles: the same upgrade decision is presented to a model as the deployed system and as the candidate, and bias shows up as a logical inconsistency between the two."
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2604.02174
    image: judgement-of-paris.jpg
  - title: "Video Unlearning via Low-Rank Refusal Vector"
    authors: "Simone Facchiano, Stefano Saravalle, Matteo Migliarini, Edoardo De Matteis, Alessio Sampieri, Andrea Pilzer, Emanuele Rodolà, Indro Spinelli, Luca Franco, Fabio Galasso"
    venue: "ICLR"
    year: 2026
    featured: true
    type: conference
    summary: "The first training-free method to remove harmful concepts from video diffusion models, using a low-rank refusal vector built from a handful of safe/unsafe prompt pairs."
    links:
      - label: arXiv
        url: https://arxiv.org/abs/2506.07891
      - label: Project page
        url: https://www.pinlab.org/video-unlearning
    image: vu-lrrv.png
  - title: "Human Motion Unlearning"
