projects:
  - title: "Inspect AI Contributions"
    year: 2026
    description: "Integrated the Anthropic API for Azure Foundry and fixed a usability issue for remote SSH users, streamlining the remote evaluation workflow. Since then, contributions to 20+ PRs and issues across Inspect AI and Inspect Evals, the UK AISI evaluation framework and its benchmark suite."
    links:
      - https://github.com/UKGovernmentBEIS/inspect_ai/pull/2935
      - https://github.com/UKGovernmentBEIS/inspect_ai/pull/2880
      - https://github.com/search?q=org%3AUKGovernmentBEIS+author%3Amamiglia&type=issues
  - title: "Mergecraft"
    year: 2024
    description: "An open-source Python library for merging fine-tuned models without retraining. It supports TIES, SLERP and DARE, works with Hugging Face models, and makes custom merging methods easy to add."
    links:
      - https://mamiglia.notion.site/Mergecraft-6decfd9415314eaf8dc5e68c078ffe6e
      - https://github.com/Mamiglia/Mergecraft
    image: the-alchemist.jpg
  - title: "PyTorch Contribution"
    year: 2024
    description: "Fixed the documentation of per-parameter options in the optimizer module, clarifying how advanced optimizer settings are meant to be used. Merged upstream."
    links:
      - https://github.com/pytorch/pytorch/pull/117436
      - https://github.com/pytorch/pytorch/issues/115935
      - https://docs.pytorch.org/docs/stable/optim.html#per-parameter-options
  - title: "Bayesian NN × Human Pose Forecasting"
    year: 2023
    description: "Predicts human poses in dynamic scenes such as human-robot interaction and autonomous driving, with a Bayesian Space-Time Graph Convolutional Network trained on Human3.6M. The uncertainty estimate allows risk-aware deployment near people."
    links:
      - https://github.com/Mamiglia/BNN_Human_motion
  - title: "Finite State Automata.web"
    year: 2022
    description: "A web editor for finite state automata, built to help computer science students understand acceptors by drawing and running them. Vue.js, responsive layout."
    links:
      - https://mamiglia.github.io/meravigliosi-automi
      - https://github.com/Mamiglia/meravigliosi-automi
  - title: "Reddit Wallpaper"
    year: 2021
    description: "An open-source dynamic wallpaper changer that automatically downloads and sets wallpapers from Reddit based on user-defined preferences. Featuring a non-repetitive selection algorithm, it ensures fresh backgrounds without repeats. With an easy installation, a GUI for customization, system tray support, and resolution filtering, it runs seamlessly in the background. Originally written in Java and later migrated to Kotlin."
    links: 
      - https://github.com/Mamiglia/Reddit-Wallpaper

  
      
